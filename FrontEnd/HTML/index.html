<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titus Hoppers Story Dispatches</title>
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <p class="eyebrow">Story Dispatches</p>
        <h1>Five long-form character dispatches, arranged like a private newsletter.</h1>
        <p class="sidebar-copy">
          The original notes remain untouched. This front end turns them into a
          narrative reading order: four character editions and one final closing dispatch.
        </p>
        <nav id="module-nav" class="module-nav" aria-label="Story dispatch navigation"></nav>
      </aside>

      <main id="app" class="content" aria-live="polite">
        <section class="loading-state">
          <p>Loading dispatches…</p>
        </section>
      </main>
    </div>

    <template id="nav-button-template">
      <a class="nav-button" href="#">
        <span class="nav-kicker"></span>
        <span class="nav-title"></span>
      </a>
    </template>

    <script src="./scripts/app.js" defer></script>
  </body>
</html>
